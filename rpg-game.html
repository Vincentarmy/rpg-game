<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG - Huyền Thoại Chiến Binh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e8e6d9;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      color: #c0b8f0;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .game {
      max-width: 860px;
      margin: 0 auto;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 600px) {
      .two-col { grid-template-columns: 1fr; }
    }

    .panel {
      background: #1a1a2e;
      border: 0.5px solid #3a3a5c;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .panel-title {
      font-size: 11px;
      font-weight: 500;
      color: #7070a0;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    .bar-wrap {
      background: #2a2a4a;
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
      margin: 3px 0;
    }

    .bar-inner { height: 100%; border-radius: 4px; transition: width .3s; }
    .hp-bar  { background: #e24b4a; }
    .mp-bar  { background: #378add; }
    .xp-bar  { background: #639922; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin: 3px 0;
    }

    .stat-label { color: #7070a0; }
    .stat-val   { font-weight: 500; color: #e8e6d9; }

    .log {
      background: #0f0f1a;
      border: 0.5px solid #3a3a5c;
      border-radius: 8px;
      padding: 10px;
      height: 170px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.7;
      font-family: 'Courier New', monospace;
    }

    .log p { margin: 1px 0; }
    .log .dmg  { color: #e24b4a; }
    .log .heal { color: #1d9e75; }
    .log .info { color: #6aadff; }
    .log .warn { color: #f0a030; }
    .log .win  { color: #a0d060; font-weight: 500; }
    .log .sys  { color: #5a5a8a; }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      background: #1e1e38;
      border: 0.5px solid #4a4a7a;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: #e8e6d9;
      transition: background .12s, transform .1s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .btn:hover:not(:disabled) { background: #2a2a50; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }

    .btn-danger { border-color: #7a2a2a; color: #ff8080; }
    .btn-info   { border-color: #2a4a7a; color: #80b8ff; }
    .btn-success{ border-color: #2a6a2a; color: #80d080; }
    .btn-warn   { border-color: #7a5a1a; color: #ffc060; }

    .grid3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .inv-item {
      background: #1e1e38;
      border: 0.5px solid #3a3a5c;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color .12s;
    }

    .inv-item:hover { border-color: #8080c0; }
    .inv-name { font-weight: 500; font-size: 13px; color: #e8e6d9; }
    .inv-qty  { font-size: 11px; color: #7070a0; margin-top: 2px; }

    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 500;
      margin-top: 4px;
    }

    .badge-hp  { background: #3a1a1a; color: #ff8080; }
    .badge-mp  { background: #1a2a3a; color: #80b8ff; }
    .badge-atk { background: #3a2a1a; color: #ffb060; }
    .badge-def { background: #1a3a2a; color: #80d080; }

    .gold-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      color: #ffc060;
      background: #2a2010;
      padding: 3px 9px;
      border-radius: 10px;
    }

    .section-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tab {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 0.5px solid #3a3a5c;
      cursor: pointer;
      background: transparent;
      color: #7070a0;
      font-weight: 500;
      transition: background .12s;
    }

    .tab.active {
      background: #2a2a50;
      color: #e8e6d9;
      border-color: #6060a0;
    }

    .enemy-box {
      border: 0.5px solid #7a2a2a;
      border-radius: 8px;
      padding: 10px;
      background: #1e0f0f;
      margin-bottom: 8px;
    }

    .enemy-name { font-weight: 500; font-size: 14px; color: #ff8080; }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .cls-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #2a1a5a;
      color: #b0a8ff;
      margin-left: 6px;
    }

    .mini-stats {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      font-size: 12px;
      color: #9090b0;
    }
  </style>
</head>
<body>

<div class="game">
  <h1>⚔ Huyền Thoại Chiến Binh</h1>

  <div class="two-col">

    <!-- CỘT TRÁI -->
    <div>
      <!-- Thông tin nhân vật -->
      <div class="panel" id="player-panel">
        <div class="player-header">
          <div>
            <span style="font-size:15px;font-weight:500" id="p-name">Chiến Binh</span>
            <span class="cls-badge" id="p-class">Warrior Lv1</span>
          </div>
          <span class="gold-badge">🪙 <span id="p-gold">50</span>G</span>
        </div>

        <div class="stat-row">
          <span class="stat-label">HP</span>
          <span class="stat-val"><span id="p-hp">100</span>/<span id="p-maxhp">100</span></span>
        </div>
        <div class="bar-wrap"><div class="bar-inner hp-bar" id="hp-bar" style="width:100%"></div></div>

        <div class="stat-row">
          <span class="stat-label">MP</span>
          <span class="stat-val"><span id="p-mp">40</span>/<span id="p-maxmp">40</span></span>
        </div>
        <div class="bar-wrap"><div class="bar-inner mp-bar" id="mp-bar" style="width:100%"></div></div>

        <div class="stat-row" style="margin-top:6px">
          <span class="stat-label">EXP</span>
          <span class="stat-val"><span id="p-xp">0</span>/<span id="p-maxxp">100</span></span>
        </div>
        <div class="bar-wrap"><div class="bar-inner xp-bar" id="xp-bar" style="width:0%"></div></div>

        <div class="mini-stats">
          <span>Lv <span id="p-lv">1</span></span>
          <span>⚔ ATK <span id="p-atk">15</span></span>
          <span>🛡 DEF <span id="p-def">5</span></span>
        </div>
      </div>

      <!-- Khu vực chiến đấu -->
      <div class="panel" id="enemy-area" style="display:none">
        <div class="panel-title">Kẻ thù</div>
        <div class="enemy-box">
          <div class="enemy-name" id="e-name">Slime</div>
          <div class="stat-row">
            <span class="stat-label">HP</span>
            <span class="stat-val"><span id="e-hp">30</span>/<span id="e-maxhp">30</span></span>
          </div>
          <div class="bar-wrap"><div class="bar-inner hp-bar" id="e-bar" style="width:100%"></div></div>
          <div style="font-size:12px;color:#7070a0;margin-top:4px">
            ATK <span id="e-atk">8</span> &nbsp;|&nbsp; EXP +<span id="e-xp">20</span> &nbsp;|&nbsp; 🪙 +<span id="e-gold">10</span>
          </div>
        </div>
        <div class="btn-grid">
          <button class="btn btn-danger" onclick="attack()">⚔ Tấn công</button>
          <button class="btn btn-info"   onclick="magic()">✨ Phép thuật (10 MP)</button>
          <button class="btn btn-success" onclick="usePotion()">💊 Dùng thuốc</button>
          <button class="btn"            onclick="flee()">🏃 Bỏ chạy</button>
        </div>
      </div>

      <!-- Hub thị trấn -->
      <div class="panel" id="hub-area">
        <div class="panel-title">Thị trấn — chọn hành động</div>
        <div class="btn-grid">
          <button class="btn btn-danger" onclick="startBattle('normal')">⚔ Vào dungeon</button>
          <button class="btn btn-warn"   onclick="startBattle('boss')">💀 Đánh boss</button>
          <button class="btn btn-success" onclick="showShop()">🛒 Cửa hàng</button>
          <button class="btn"            onclick="rest()">😴 Nghỉ ngơi (20G)</button>
        </div>
      </div>
    </div>

    <!-- CỘT PHẢI -->
    <div>
      <!-- Log chiến đấu -->
      <div class="panel">
        <div class="panel-title">Nhật ký chiến đấu</div>
        <div class="log" id="log"></div>
      </div>

      <!-- Tabs: Inventory / Shop / Stats -->
      <div class="panel">
        <div class="section-tabs">
          <button class="tab active" onclick="switchTab('inv')">Túi đồ</button>
          <button class="tab"        onclick="switchTab('shop')">Cửa hàng</button>
          <button class="tab"        onclick="switchTab('stats')">Chỉ số</button>
        </div>

        <div id="tab-inv">
          <div style="font-size:12px;color:#7070a0;margin-bottom:6px">Nhấn vào vật phẩm để dùng</div>
          <div class="grid3" id="inv-grid"></div>
        </div>

        <div id="tab-shop" style="display:none">
          <div class="grid3" id="shop-grid"></div>
        </div>

        <div id="tab-stats" style="display:none">
          <div id="stats-content"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const G = {
    player: {
      name: "Chiến Binh", cls: "Warrior",
      lv: 1, hp: 100, maxhp: 100, mp: 40, maxmp: 40,
      atk: 15, def: 5, xp: 0, maxxp: 100, gold: 50
    },
    enemy: null,
    inBattle: false,
    inv: [
      { id: "potion", name: "Máu nhỏ",  qty: 3, type: "hp", val: 30 },
      { id: "mana",   name: "Mana nhỏ", qty: 2, type: "mp", val: 20 }
    ],
    shop: [
      { id: "potion",   name: "Máu nhỏ",  price: 15,  type: "hp",  val: 30,  desc: "+30 HP" },
      { id: "bigpotion",name: "Máu lớn",  price: 35,  type: "hp",  val: 80,  desc: "+80 HP" },
      { id: "mana",     name: "Mana nhỏ", price: 12,  type: "mp",  val: 20,  desc: "+20 MP" },
      { id: "sword1",   name: "Kiếm sắt", price: 60,  type: "atk", val: 8,   desc: "+8 ATK",  oneTime: true },
      { id: "armor1",   name: "Giáp da",  price: 50,  type: "def", val: 5,   desc: "+5 DEF",  oneTime: true },
      { id: "sword2",   name: "Kiếm thép",price: 120, type: "atk", val: 18,  desc: "+18 ATK", oneTime: true },
      { id: "armor2",   name: "Giáp sắt", price: 100, type: "def", val: 10,  desc: "+10 DEF", oneTime: true },
    ],
    bought: [],
    enemies: [
      { name: "Slime xanh",  hp: 25,  atk: 6,  xp: 15,  gold: 8  },
      { name: "Goblin",      hp: 40,  atk: 10, xp: 25,  gold: 15 },
      { name: "Orc",         hp: 70,  atk: 16, xp: 40,  gold: 25 },
      { name: "Wyvern",      hp: 110, atk: 22, xp: 60,  gold: 40 },
      { name: "Demon",       hp: 170, atk: 30, xp: 90,  gold: 60 },
    ],
    bosses: [
      { name: "BOSS: Lich Vương", hp: 200, atk: 30, xp: 150, gold: 100 },
      { name: "BOSS: Rồng Đen",  hp: 350, atk: 45, xp: 300, gold: 200 },
    ]
  };

  function log(msg, cls = "") {
    const d = document.getElementById("log");
    const p = document.createElement("p");
    p.className = cls;
    p.textContent = msg;
    d.appendChild(p);
    d.scrollTop = d.scrollHeight;
  }

  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function updateUI() {
    const p = G.player;
    document.getElementById("p-name").textContent = p.name;
    document.getElementById("p-class").textContent = p.cls + " Lv" + p.lv;
    document.getElementById("p-hp").textContent = p.hp;
    document.getElementById("p-maxhp").textContent = p.maxhp;
    document.getElementById("p-mp").textContent = p.mp;
    document.getElementById("p-maxmp").textContent = p.maxmp;
    document.getElementById("p-atk").textContent = p.atk;
    document.getElementById("p-def").textContent = p.def;
    document.getElementById("p-lv").textContent = p.lv;
    document.getElementById("p-xp").textContent = p.xp;
    document.getElementById("p-maxxp").textContent = p.maxxp;
    document.getElementById("p-gold").textContent = p.gold;
    document.getElementById("hp-bar").style.width = Math.max(0, p.hp / p.maxhp * 100) + "%";
    document.getElementById("mp-bar").style.width = (p.mp / p.maxmp * 100) + "%";
    document.getElementById("xp-bar").style.width = (p.xp / p.maxxp * 100) + "%";

    if (G.enemy) {
      const e = G.enemy;
      document.getElementById("e-name").textContent = e.name;
      document.getElementById("e-hp").textContent = Math.max(0, e.hp);
      document.getElementById("e-maxhp").textContent = e.maxhp;
      document.getElementById("e-atk").textContent = e.atk;
      document.getElementById("e-xp").textContent = e.xp;
      document.getElementById("e-gold").textContent = e.gold;
      document.getElementById("e-bar").style.width = Math.max(0, e.hp / e.maxhp * 100) + "%";
    }

    renderInv();
    renderStats();
  }

  function renderInv() {
    const g = document.getElementById("inv-grid");
    if (!G.inv.length) {
      g.innerHTML = '<p style="font-size:12px;color:#7070a0;grid-column:1/-1">Túi trống rỗng</p>';
      return;
    }
    g.innerHTML = G.inv.map((it, i) => `
      <div class="inv-item" onclick="useItem(${i})">
        <div class="inv-name">${it.name}</div>
        <div class="inv-qty">x${it.qty}</div>
        <span class="badge ${it.type === 'hp' ? 'badge-hp' : it.type === 'mp' ? 'badge-mp' : 'badge-atk'}">
          ${it.type === 'hp' ? '+HP' : it.type === 'mp' ? '+MP' : '+ATK'}
        </span>
      </div>`).join("");
  }

  function renderShop() {
    const g = document.getElementById("shop-grid");
    g.innerHTML = G.shop.map((it, i) => {
      const bought = it.oneTime && G.bought.includes(it.id);
      return `
        <div class="inv-item" style="opacity:${bought ? .5 : 1}" onclick="${bought ? '' : `buyItem(${i})`}">
          <div class="inv-name">${it.name}</div>
          <div class="inv-qty">${it.desc}</div>
          <span class="badge ${it.type === 'hp' ? 'badge-hp' : it.type === 'mp' ? 'badge-mp' : it.type === 'atk' ? 'badge-atk' : 'badge-def'}">
            ${bought ? 'Đã mua' : it.price + 'G'}
          </span>
        </div>`;
    }).join("");
  }

  function renderStats() {
    const p = G.player;
    document.getElementById("stats-content").innerHTML = `
      <div style="font-size:13px;line-height:2.2">
        <div class="stat-row"><span class="stat-label">Cấp độ</span><span class="stat-val">${p.lv}</span></div>
        <div class="stat-row"><span class="stat-label">HP tối đa</span><span class="stat-val">${p.maxhp}</span></div>
        <div class="stat-row"><span class="stat-label">MP tối đa</span><span class="stat-val">${p.maxmp}</span></div>
        <div class="stat-row"><span class="stat-label">Tấn công</span><span class="stat-val">${p.atk}</span></div>
        <div class="stat-row"><span class="stat-label">Phòng thủ</span><span class="stat-val">${p.def}</span></div>
        <div class="stat-row"><span class="stat-label">Vàng</span><span class="stat-val">${p.gold} G</span></div>
        <div class="stat-row"><span class="stat-label">EXP</span><span class="stat-val">${p.xp} / ${p.maxxp}</span></div>
      </div>`;
  }

  function switchTab(t) {
    ["inv", "shop", "stats"].forEach(id => {
      document.getElementById("tab-" + id).style.display = id === t ? "block" : "none";
    });
    document.querySelectorAll(".tab").forEach((b, i) => {
      b.classList.toggle("active", ["inv", "shop", "stats"][i] === t);
    });
    if (t === "shop") renderShop();
  }

  function showShop() { switchTab("shop"); }

  function startBattle(type) {
    const p = G.player;
    let pool = type === "boss" ? G.bosses : G.enemies;
    let idx = type === "boss"
      ? Math.min(Math.floor(p.lv / 3), G.bosses.length - 1)
      : Math.min(Math.floor(p.lv / 2), G.enemies.length - 1);
    let src = pool[idx];
    G.enemy = { ...src, maxhp: src.hp };
    G.inBattle = true;
    document.getElementById("enemy-area").style.display = "block";
    document.getElementById("hub-area").style.display = "none";
    log("--- Cuộc chiến bắt đầu! ---", "sys");
    log(src.name + " xuất hiện! Chuẩn bị chiến đấu!", "warn");
    updateUI();
  }

  function enemyTurn() {
    if (!G.enemy || G.enemy.hp <= 0) return;
    const dmg = Math.max(1, G.enemy.atk - G.player.def + rand(-3, 3));
    G.player.hp = Math.max(0, G.player.hp - dmg);
    log(G.enemy.name + " phản công! Bạn mất " + dmg + " HP.", "dmg");
    if (G.player.hp <= 0) {
      log("Bạn đã bị đánh bại! Hồi sinh tại thị trấn... (mất 10G)", "warn");
      G.player.hp = Math.floor(G.player.maxhp * 0.4);
      G.player.gold = Math.max(0, G.player.gold - 10);
      endBattle();
    }
    updateUI();
  }

  function checkWin() {
    if (G.enemy.hp <= 0) {
      log(G.enemy.name + " đã bị tiêu diệt!", "win");
      G.player.xp += G.enemy.xp;
      G.player.gold += G.enemy.gold;
      log("+" + G.enemy.xp + " EXP, +" + G.enemy.gold + " Vàng nhận được!", "heal");
      checkLevelUp();
      endBattle();
      return true;
    }
    return false;
  }

  function checkLevelUp() {
    const p = G.player;
    while (p.xp >= p.maxxp) {
      p.xp -= p.maxxp;
      p.lv++;
      p.maxxp = Math.floor(p.maxxp * 1.4);
      p.maxhp += 20; p.hp = p.maxhp;
      p.maxmp += 10; p.mp = p.maxmp;
      p.atk += 4; p.def += 2;
      log("★ LEVEL UP! Lên cấp " + p.lv + "! HP/MP phục hồi đầy!", "win");
      log("ATK +" + (p.atk) + " | DEF +" + (p.def) + " | HP Max " + p.maxhp, "heal");
    }
  }

  function endBattle() {
    G.enemy = null;
    G.inBattle = false;
    document.getElementById("enemy-area").style.display = "none";
    document.getElementById("hub-area").style.display = "block";
    updateUI();
  }

  function attack() {
    if (!G.inBattle) return;
    const dmg = Math.max(1, G.player.atk - Math.floor(G.enemy.atk / 4) + rand(-3, 5));
    G.enemy.hp -= dmg;
    log("Bạn tấn công! " + G.enemy.name + " mất " + dmg + " HP.", "info");
    if (!checkWin()) enemyTurn();
    updateUI();
  }

  function magic() {
    if (!G.inBattle) return;
    if (G.player.mp < 10) { log("Không đủ MP để dùng phép!", "warn"); return; }
    G.player.mp -= 10;
    const dmg = Math.max(5, Math.floor(G.player.atk * 1.8) + rand(0, 8));
    G.enemy.hp -= dmg;
    log("✨ Phép thuật! " + G.enemy.name + " mất " + dmg + " HP!", "info");
    if (!checkWin()) enemyTurn();
    updateUI();
  }

  function usePotion() {
    const pot = G.inv.find(i => i.type === "hp");
    if (!pot) { log("Không có thuốc máu trong túi!", "warn"); return; }
    const gain = Math.min(pot.val, G.player.maxhp - G.player.hp);
    G.player.hp += gain;
    log("Dùng " + pot.name + ": +" + gain + " HP hồi phục.", "heal");
    pot.qty--;
    if (pot.qty <= 0) G.inv.splice(G.inv.indexOf(pot), 1);
    if (G.inBattle) enemyTurn();
    updateUI();
  }

  function flee() {
    if (Math.random() < 0.5) {
      log("Bỏ chạy thành công! Thoát khỏi chiến đấu.", "sys");
      endBattle();
    } else {
      log("Bỏ chạy thất bại! Kẻ thù không cho thoát.", "warn");
      enemyTurn();
      updateUI();
    }
  }

  function useItem(i) {
    const it = G.inv[i];
    if (!it) return;
    const p = G.player;
    if (it.type === "hp") {
      const gain = Math.min(it.val, p.maxhp - p.hp);
      p.hp += gain;
      log("Dùng " + it.name + ": +" + gain + " HP", "heal");
    } else if (it.type === "mp") {
      const gain = Math.min(it.val, p.maxmp - p.mp);
      p.mp += gain;
      log("Dùng " + it.name + ": +" + gain + " MP", "heal");
    }
    it.qty--;
    if (it.qty <= 0) G.inv.splice(i, 1);
    if (G.inBattle) enemyTurn();
    updateUI();
  }

  function buyItem(i) {
    const it = G.shop[i];
    if (G.player.gold < it.price) { log("Không đủ vàng để mua " + it.name + "!", "warn"); return; }
    if (it.oneTime && G.bought.includes(it.id)) { return; }
    G.player.gold -= it.price;
    if (it.type === "atk") {
      G.player.atk += it.val;
      log("Trang bị " + it.name + "! ATK +" + it.val, "heal");
      G.bought.push(it.id);
    } else if (it.type === "def") {
      G.player.def += it.val;
      log("Trang bị " + it.name + "! DEF +" + it.val, "heal");
      G.bought.push(it.id);
    } else {
      const ex = G.inv.find(x => x.id === it.id);
      if (ex) ex.qty++;
      else G.inv.push({ id: it.id, name: it.name, qty: 1, type: it.type, val: it.val });
      log("Mua " + it.name + " thành công!", "heal");
    }
    renderShop();
    updateUI();
  }

  function rest() {
    if (G.player.gold < 20) { log("Không đủ vàng để nghỉ ngơi (cần 20G)!", "warn"); return; }
    G.player.gold -= 20;
    G.player.hp = G.player.maxhp;
    G.player.mp = G.player.maxmp;
    log("Nghỉ ngơi tại quán trọ. HP/MP hồi đầy!", "heal");
    updateUI();
  }

  log("Chào mừng đến thế giới RPG!", "sys");
  log("Vào dungeon để chiến đấu, mua đồ để mạnh hơn.", "sys");
  log("Lên cấp 3+ rồi thử thách Boss nhé!", "sys");
  updateUI();
  renderShop();
</script>
